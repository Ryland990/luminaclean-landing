<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Signal — LuminaClean Web Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a; --surface: #111111; --surface-lifted: #191919;
    --pink: #ff2e63; --pink-soft: #ff5c84; --lime: #c7f464; --lime-soft: #d8ff7a;
    --dark-on-lime: #0d1a00; --white: #ffffff; --gray: #9a9a9a; --gray-dim: #6a6a6a;
    --stroke: rgba(255,255,255,0.10);
    --mono: 'JetBrains Mono', ui-monospace, monospace; --display: 'Anton', 'Arial Narrow', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--gray); font-family: var(--mono); min-height: 100vh; padding: 2rem 1.4rem 4rem; }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { font-family: var(--display); font-weight: 400; text-transform: uppercase; color: var(--white); font-size: clamp(2rem, 6vw, 2.8rem); letter-spacing: 0.01em; margin-bottom: 0.3rem; }
  .sub { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray-dim); margin-bottom: 2.2rem; }
  .sub .dot { color: var(--lime); }

  .gate { max-width: 380px; margin: 4rem auto; text-align: center; }
  .gate input { width: 100%; background: var(--surface); border: 1px solid var(--stroke); color: var(--white); font-family: var(--mono); font-size: 0.85rem; padding: 0.8rem 1rem; border-radius: 10px; margin: 1rem 0; }
  .gate button { width: 100%; background: var(--lime); color: var(--dark-on-lime); border: none; font-family: var(--display); font-size: 1rem; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.8rem; border-radius: 10px; cursor: pointer; }

  .panel { display: none; }
  .panel.show { display: block; }

  h2 { font-family: var(--display); font-weight: 400; text-transform: uppercase; color: var(--white); font-size: 1.2rem; letter-spacing: 0.03em; margin: 2.2rem 0 1rem; }

  .funnel { display: flex; flex-direction: column; gap: 0.5rem; }
  .stage { background: var(--surface); border: 1px solid var(--stroke); border-radius: 12px; padding: 0.9rem 1.1rem; position: relative; overflow: hidden; }
  .stage-bar { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(199,244,100,0.14), transparent); }
  .stage-row { display: flex; justify-content: space-between; align-items: baseline; position: relative; }
  .stage-name { font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray); }
  .stage-nums { display: flex; gap: 1.2rem; align-items: baseline; }
  .stage-nums b { font-family: var(--display); font-size: 1.5rem; color: var(--white); font-weight: 400; }
  .stage-nums .uniq { color: var(--lime); }
  .stage-nums span.label { font-size: 0.6rem; color: var(--gray-dim); text-transform: uppercase; letter-spacing: 0.08em; margin-left: 0.2rem; }
  .stage-drop { font-size: 0.68rem; color: var(--pink-soft); margin-top: 0.3rem; position: relative; }

  table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
  th, td { text-align: left; padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--stroke); }
  th { color: var(--gray-dim); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.62rem; }
  td { color: var(--white); }
  td.num { color: var(--lime); font-variant-numeric: tabular-nums; }

  .feed { display: flex; flex-direction: column; gap: 0; max-height: 420px; overflow-y: auto; border: 1px solid var(--stroke); border-radius: 12px; background: var(--surface); }
  .feed-row { display: flex; gap: 0.8rem; padding: 0.6rem 1rem; border-bottom: 1px solid var(--stroke); font-size: 0.72rem; align-items: baseline; }
  .feed-row:last-child { border-bottom: none; }
  .feed-time { color: var(--gray-dim); min-width: 62px; }
  .feed-event { color: var(--lime); min-width: 150px; }
  .feed-path { color: var(--gray); flex: 1; }
  .feed-utm { color: var(--pink-soft); font-size: 0.65rem; }

  .empty { color: var(--gray-dim); font-size: 0.78rem; padding: 1rem; text-align: center; }
  .refresh-note { font-size: 0.62rem; color: var(--gray-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 0.5rem; }
  .err { color: var(--pink-soft); font-size: 0.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Signal</h1>
  <p class="sub"><span class="dot">●</span> LuminaClean web analytics — try-demo funnel</p>

  <div class="gate" id="gate">
    <p style="color:var(--gray-dim);font-size:0.75rem;letter-spacing:0.06em;">Enter access key</p>
    <input type="password" id="keyInput" placeholder="key" autofocus>
    <button id="keyBtn">View</button>
    <p class="err" id="gateErr" style="margin-top:0.8rem;"></p>
  </div>

  <div class="panel" id="panel">
    <h2>Funnel</h2>
    <p class="refresh-note" id="entryPaths" style="margin-bottom:0.8rem;"></p>
    <div class="funnel" id="funnel"></div>

    <h2>By ad creative</h2>
    <div id="creatives"></div>

    <h2>Recent activity</h2>
    <div class="feed" id="feed"></div>
    <p class="refresh-note">auto-refreshes every 20s</p>
  </div>
</div>

<script>
(function () {
  var LABELS = {
    try_demo_deck: 'Reached the deck',
    try_demo_complete: 'Completed demo',
    try_demo_store_click: 'Clicked App Store'
  };

  var gate = document.getElementById('gate');
  var panel = document.getElementById('panel');
  var keyInput = document.getElementById('keyInput');
  var gateErr = document.getElementById('gateErr');
  var timer = null;

  function fmtTime(ts) {
    var d = new Date(ts);
    return d.toTimeString().slice(0, 8);
  }

  function render(data) {
    var entryEl = document.getElementById('entryPaths');
    var totalEntry = (data.entryPaths.story || 0) + (data.entryPaths.skip || 0);
    entryEl.textContent = totalEntry
      ? 'Arrived via: ' + data.entryPaths.story + ' watched the story intro, ' + data.entryPaths.skip + ' skipped straight to the demo'
      : '';

    var funnelEl = document.getElementById('funnel');
    funnelEl.innerHTML = '';
    var prevUnique = null;
    data.funnel.forEach(function (stage) {
      var dropHtml = '';
      if (prevUnique !== null && prevUnique > 0) {
        var pct = Math.round((stage.unique / prevUnique) * 100);
        dropHtml = '<div class="stage-drop">' + pct + '% of previous stage</div>';
      }
      prevUnique = stage.unique;
      var maxW = data.funnel[0].unique || 1;
      var barW = Math.max(4, Math.round((stage.unique / maxW) * 100));
      funnelEl.insertAdjacentHTML('beforeend',
        '<div class="stage"><div class="stage-bar" style="width:' + barW + '%"></div>' +
        '<div class="stage-row"><span class="stage-name">' + (LABELS[stage.event] || stage.event) + '</span>' +
        '<span class="stage-nums"><b class="uniq">' + stage.unique + '</b><span class="label">unique</span>' +
        '<b>' + stage.raw + '</b><span class="label">events</span></span></div>' +
        dropHtml + '</div>');
    });

    var credEl = document.getElementById('creatives');
    if (!data.creativeStats.length) {
      credEl.innerHTML = '<p class="empty">No UTM-tagged traffic yet — this fills in once ad clicks arrive.</p>';
    } else {
      var rows = data.creativeStats.map(function (c) {
        return '<tr><td>' + c.campaign + '</td><td>' + c.content + '</td>' +
          c.stages.map(function (n) { return '<td class="num">' + n + '</td>'; }).join('') + '</tr>';
      }).join('');
      credEl.innerHTML = '<table><thead><tr><th>Campaign</th><th>Creative</th><th>Deck</th><th>Complete</th><th>Click</th></tr></thead><tbody>' + rows + '</tbody></table>';
    }

    var feedEl = document.getElementById('feed');
    if (!data.activity.length) {
      feedEl.innerHTML = '<p class="empty">No events yet.</p>';
    } else {
      feedEl.innerHTML = data.activity.map(function (a) {
        var utm = a.utm_campaign ? '<span class="feed-utm">' + a.utm_campaign + (a.utm_content ? ' / ' + a.utm_content : '') + '</span>' : '';
        return '<div class="feed-row"><span class="feed-time">' + fmtTime(a.ts) + '</span>' +
          '<span class="feed-event">' + a.event + '</span><span class="feed-path">' + a.path + '</span>' + utm + '</div>';
      }).join('');
    }
  }

  function load(key) {
    fetch('/api/stats?key=' + encodeURIComponent(key))
      .then(function (r) {
        if (r.status === 401) throw new Error('wrong key');
        if (!r.ok) throw new Error('server error (' + r.status + ')');
        return r.json();
      })
      .then(function (data) {
        gate.style.display = 'none';
        panel.classList.add('show');
        render(data);
        localStorage.setItem('wa_key', key);
        clearTimeout(timer);
        timer = setTimeout(function () { load(key); }, 20000);
      })
      .catch(function (e) {
        gateErr.textContent = e.message;
        localStorage.removeItem('wa_key');
      });
  }

  document.getElementById('keyBtn').addEventListener('click', function () { load(keyInput.value.trim()); });
  keyInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') load(keyInput.value.trim()); });

  var saved = localStorage.getItem('wa_key');
  if (saved) load(saved);
})();
</script>
</body>
</html>
